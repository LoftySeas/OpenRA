name: Strategic AI GitHub Runner Quick Screen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    name: Ubuntu six-job 2/4/6-worker quick screen
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Clone exact quick-screen commit
        uses: actions/checkout@v7

      - name: Initialize evidence roots
        run: mkdir -p "$RUNNER_TEMP/m3-quick" "$RUNNER_TEMP/m3-quick-registration"

      - name: Install .NET 10 and runtime packages
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libopenal1 mesa-utils time

      - name: Test the controller
        run: |
          python3 -m unittest tools.tests.test_strategic_ai_runner
          bash -n tools/run_github_quick_tier.sh

      - name: Build the Linux worker once
        run: dotnet build -c Debug -nologo -warnaserror -p:TargetPlatform=linux-x64

      - name: Prepare verified RA content
        run: |
          mkdir -p "$RUNNER_TEMP/strategic-ai-content"
          python3 tools/prepare_ra_content.py --support-dir "$RUNNER_TEMP/strategic-ai-content"

      - name: Materialize the frozen six-job quick screen
        run: |
          python3 tools/prepare_m3_experiment.py \
            --plan docs/ai/examples/m3-experiment-plan.json \
            --phase training \
            --output-dir "$RUNNER_TEMP/m3-quick-registration"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "m3-quick-registration"
          source_path = root / "experiment-manifest.json"
          output_path = root / "github-quick-six.json"
          source = json.loads(source_path.read_text(encoding="utf-8"))
          by_id = {match["id"]: match for match in source["matches"]}
          selected = (
              ("tr-ore-lord-normal-s01-c40-r0", "quick-ore-lord-normal-c40"),
              ("tr-ore-lord-rush-s02-c40-r0", "quick-ore-lord-rush-c40"),
              ("tr-siberian-pass-normal-s03-c40-r0", "quick-siberian-pass-normal-c40"),
              ("tr-siberian-pass-rush-s04-c40-r0", "quick-siberian-pass-rush-c40"),
              ("tr-behind-the-veil-normal-s05-c40-r0", "quick-behind-the-veil-normal-c40"),
              ("tr-behind-the-veil-rush-s06-c40-r0", "quick-behind-the-veil-rush-c40"),
          )

          specification_root = root / "quick-specifications"
          specification_root.mkdir(exist_ok=True)
          matches = []
          provenance = {}
          for source_id, quick_id in selected:
              if source_id not in by_id:
                  raise SystemExit(f"Training manifest lacks {source_id}")
              source_match = by_id[source_id]
              source_specification = root / source_match["specificationPath"]
              specification = json.loads(source_specification.read_text(encoding="utf-8"))
              specification["maxWorldTicks"] = 30000
              quick_specification = specification_root / f"{quick_id}.json"
              quick_specification.write_text(
                  json.dumps(specification, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              match = dict(source_match)
              match["id"] = quick_id
              match["specificationPath"] = quick_specification.relative_to(root).as_posix()
              matches.append(match)
              provenance[quick_id] = source_id

          value = dict(source)
          value["matches"] = matches
          value["matchTimeoutSeconds"] = 120
          value["verificationTimeoutSeconds"] = 90
          output_path.write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          registration = {
              "schemaVersion": "1.0.0",
              "decisionInfluence": "NONE",
              "formalSelection": False,
              "purpose": "GITHUB_RUNNER_QUICK_SCREEN",
              "selectionObjective": "MAX_TOTAL_USEFUL_MATCHES_PER_HOUR",
              "sourceManifestSha256": hashlib.sha256(source_path.read_bytes()).hexdigest(),
              "quickManifestSha256": hashlib.sha256(output_path.read_bytes()).hexdigest(),
              "workerCounts": [2, 4, 6],
              "jobCount": len(matches),
              "repeatPairCount": 0,
              "maxWorldTicks": 30000,
              "matchTimeoutSeconds": 120,
              "verificationTimeoutSeconds": 90,
              "jobIds": [match["id"] for match in matches],
              "sourceJobIds": provenance,
          }
          (root / "github-quick-registration.json").write_text(
              json.dumps(registration, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Capture runner identity
        run: |
          python3 - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          keys = (
              "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA",
              "RUNNER_NAME", "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion",
          )
          value = {key: os.environ.get(key) for key in keys}
          value["platform"] = platform.platform()
          value["processor"] = platform.processor()
          path = Path(os.environ["RUNNER_TEMP"]) / "m3-quick" / "runner-metadata.json"
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          uname -a > "$RUNNER_TEMP/m3-quick/uname.txt"
          lscpu > "$RUNNER_TEMP/m3-quick/lscpu.txt"

      - name: Run six jobs with 2 workers
        run: |
          bash tools/run_github_quick_tier.sh 2 \
            "$RUNNER_TEMP/m3-quick-registration/github-quick-six.json" \
            "$RUNNER_TEMP/m3-quick/workers-2" \
            "$RUNNER_TEMP/strategic-ai-content/Content" \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/m3-quick"

      - name: Stage 2-worker evidence
        if: always()
        run: |
          stage="$RUNNER_TEMP/m3-quick-tier-2"
          mkdir -p "$stage" "$RUNNER_TEMP/m3-quick/workers-2"
          tar --exclude='*/Content' --exclude='*/Content/*' --exclude='ra-quickinstall.zip' \
            -czf "$stage/workers-2.tar.gz" -C "$RUNNER_TEMP" \
            m3-quick/workers-2 m3-quick-registration \
            m3-quick/resource-samples-workers-2.csv m3-quick/workers-2-time.txt \
            m3-quick/controller-exit-code-workers-2.txt m3-quick/runner-metadata.json \
            m3-quick/memory-events-before-workers-2.txt m3-quick/memory-events-after-workers-2.txt \
            m3-quick/uname.txt m3-quick/lscpu.txt

      - name: Upload 2-worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strategic-ai-quick-screen-workers-2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-quick-tier-2/workers-2.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Run six jobs with 4 workers
        if: always()
        run: |
          bash tools/run_github_quick_tier.sh 4 \
            "$RUNNER_TEMP/m3-quick-registration/github-quick-six.json" \
            "$RUNNER_TEMP/m3-quick/workers-4" \
            "$RUNNER_TEMP/strategic-ai-content/Content" \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/m3-quick"

      - name: Stage 4-worker evidence
        if: always()
        run: |
          stage="$RUNNER_TEMP/m3-quick-tier-4"
          mkdir -p "$stage" "$RUNNER_TEMP/m3-quick/workers-4"
          tar --exclude='*/Content' --exclude='*/Content/*' --exclude='ra-quickinstall.zip' \
            -czf "$stage/workers-4.tar.gz" -C "$RUNNER_TEMP" \
            m3-quick/workers-4 m3-quick-registration \
            m3-quick/resource-samples-workers-4.csv m3-quick/workers-4-time.txt \
            m3-quick/controller-exit-code-workers-4.txt m3-quick/runner-metadata.json \
            m3-quick/memory-events-before-workers-4.txt m3-quick/memory-events-after-workers-4.txt \
            m3-quick/uname.txt m3-quick/lscpu.txt

      - name: Upload 4-worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strategic-ai-quick-screen-workers-4-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-quick-tier-4/workers-4.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Run six jobs with 6 workers
        if: always()
        run: |
          bash tools/run_github_quick_tier.sh 6 \
            "$RUNNER_TEMP/m3-quick-registration/github-quick-six.json" \
            "$RUNNER_TEMP/m3-quick/workers-6" \
            "$RUNNER_TEMP/strategic-ai-content/Content" \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/m3-quick"

      - name: Stage 6-worker evidence
        if: always()
        run: |
          stage="$RUNNER_TEMP/m3-quick-tier-6"
          mkdir -p "$stage" "$RUNNER_TEMP/m3-quick/workers-6"
          tar --exclude='*/Content' --exclude='*/Content/*' --exclude='ra-quickinstall.zip' \
            -czf "$stage/workers-6.tar.gz" -C "$RUNNER_TEMP" \
            m3-quick/workers-6 m3-quick-registration \
            m3-quick/resource-samples-workers-6.csv m3-quick/workers-6-time.txt \
            m3-quick/controller-exit-code-workers-6.txt m3-quick/runner-metadata.json \
            m3-quick/memory-events-before-workers-6.txt m3-quick/memory-events-after-workers-6.txt \
            m3-quick/uname.txt m3-quick/lscpu.txt

      - name: Upload 6-worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strategic-ai-quick-screen-workers-6-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-quick-tier-6/workers-6.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Classify the quick screen
        if: always()
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "m3-quick"
          registration_root = Path(os.environ["RUNNER_TEMP"]) / "m3-quick-registration"
          registration = json.loads(
              (registration_root / "github-quick-registration.json").read_text(encoding="utf-8")
          )
          expected_ids = set(registration["jobIds"])

          def evidence(job):
              match = job.get("match") or {}
              match_result = match.get("result") or {}
              verification = job.get("verification") or {}
              verification_result = verification.get("result") or {}
              return {
                  "specificationSha256": job.get("specificationSha256"),
                  "matchStatus": match_result.get("status"),
                  "finalWorldTick": match_result.get("finalWorldTick"),
                  "finalSyncHash": match_result.get("finalSyncHash"),
                  "orderDigestSha256": match_result.get("orderDigestSha256"),
                  "strategicDecisionDigestSha256": match_result.get("strategicDecisionDigestSha256"),
                  "players": match_result.get("players"),
                  "verificationStatus": verification_result.get("status"),
                  "observedFinalWorldTick": verification_result.get("observedFinalWorldTick"),
                  "outOfSyncFrame": verification_result.get("outOfSyncFrame"),
              }

          def memory_events(path):
              if not path.is_file():
                  return {}
              return {
                  key: int(value)
                  for key, value in (line.split() for line in path.read_text(encoding="utf-8").splitlines())
              }

          summaries = []
          baseline = None
          baseline_jobs = None
          cross_differences = []
          cross_incomplete = []
          measurement_complete = True
          for workers in registration["workerCounts"]:
              result_path = root / f"workers-{workers}" / "experiment-result.json"
              if not result_path.is_file():
                  measurement_complete = False
                  summaries.append({"workers": workers, "eligible": False, "resultMissing": True})
                  continue
              result = json.loads(result_path.read_text(encoding="utf-8"))
              jobs = result.get("jobs") or {}
              if set(jobs) != expected_ids:
                  measurement_complete = False
              current = {job_id: evidence(job) for job_id, job in jobs.items()}
              if baseline is None:
                  baseline = current
                  baseline_jobs = jobs
              else:
                  for job_id in sorted(expected_ids):
                      if job_id not in baseline or job_id not in current:
                          cross_incomplete.append({"workers": workers, "jobId": job_id, "reason": "missing"})
                          continue
                      baseline_job = (baseline_jobs or {}).get(job_id) or {}
                      current_job = jobs.get(job_id) or {}
                      if baseline_job.get("status") != "VALID" or current_job.get("status") != "VALID":
                          cross_incomplete.append({"workers": workers, "jobId": job_id, "reason": "invalid"})
                          continue
                      fields = [field for field in baseline[job_id] if baseline[job_id][field] != current[job_id][field]]
                      if fields:
                          cross_differences.append({"workers": workers, "jobId": job_id, "fields": fields})

              controller_path = root / f"controller-exit-code-workers-{workers}.txt"
              controller_exit = int(controller_path.read_text(encoding="utf-8").strip()) if controller_path.is_file() else None
              samples_path = root / f"resource-samples-workers-{workers}.csv"
              samples = []
              if samples_path.is_file():
                  with samples_path.open(newline="", encoding="utf-8") as stream:
                      samples = list(csv.DictReader(stream))
              max_processes = max((int(row["openra_processes"]) for row in samples), default=0)
              max_rss = max((int(row["openra_rss_kib"]) for row in samples), default=0) * 1024
              min_available = min((int(row["mem_available_bytes"]) for row in samples), default=0)
              min_disk = min((int(row["disk_available_bytes"]) for row in samples), default=0)
              max_swap = max((int(row["swap_used_bytes"]) for row in samples), default=0)
              events_before = memory_events(root / f"memory-events-before-workers-{workers}.txt")
              events_after = memory_events(root / f"memory-events-after-workers-{workers}.txt")
              oom_delta = events_after.get("oom", 0) - events_before.get("oom", 0)
              oom_kill_delta = events_after.get("oom_kill", 0) - events_before.get("oom_kill", 0)
              valid_count = sum(job.get("status") == "VALID" for job in jobs.values())
              timed_out_count = sum(
                  bool((job.get("match") or {}).get("timedOut"))
                  or bool((job.get("verification") or {}).get("timedOut"))
                  for job in jobs.values()
              )
              replay_logs = list((root / f"workers-{workers}").glob("workers/*/attempts/*/verify/Logs/strategic-decisions.log"))
              replay_log_bytes = sum(path.stat().st_size for path in replay_logs)
              repeat = result.get("repeatEquivalence") or {}
              provenance = result.get("controllerProvenance") or {}
              wall = result.get("wallClockElapsedSeconds") or 0
              checks = {
                  "controllerExitZero": controller_exit == 0,
                  "resultCompleted": result.get("status") == "COMPLETED",
                  "manifestIdentity": result.get("manifestSha256") == registration["quickManifestSha256"],
                  "requestedConcurrencyRecorded": result.get("maxWorkers") == workers,
                  "requestedConcurrencyObserved": max_processes == workers,
                  "controllerProvenanceComplete": provenance.get("complete") is True,
                  "exactJobIds": set(jobs) == expected_ids,
                  "allJobsValid": valid_count == registration["jobCount"],
                  "noProcessTimeout": timed_out_count == 0,
                  "noImplicitRepeatPairs": repeat.get("pairCount") == 0,
                  "replayLogsPresentAndEmpty": len(replay_logs) == registration["jobCount"] and replay_log_bytes == 0,
                  "rssWithinLimit": max_rss <= 11 * 1024**3,
                  "availableMemoryWithinLimit": min_available >= 4 * 1024**3,
                  "diskWithinLimit": min_disk >= 10 * 1024**3,
                  "noSwap": max_swap == 0,
                  "noOom": oom_delta == 0 and oom_kill_delta == 0,
              }
              failures = [name for name, passed in checks.items() if not passed]
              summaries.append({
                  "workers": workers,
                  "jobCount": len(jobs),
                  "validCount": valid_count,
                  "controllerExitCode": controller_exit,
                  "timedOutProcessCount": timed_out_count,
                  "wallClockElapsedSeconds": wall,
                  "usefulMatchesPerHour": valid_count * 3600 / wall if wall else 0,
                  "maxOpenRaProcesses": max_processes,
                  "maxCombinedRssBytes": max_rss,
                  "minAvailableMemoryBytes": min_available,
                  "minDiskAvailableBytes": min_disk,
                  "maxSwapUsedBytes": max_swap,
                  "oomDelta": oom_delta,
                  "oomKillDelta": oom_kill_delta,
                  "eligibilityChecks": checks,
                  "eligibilityFailures": failures,
                  "eligible": not failures,
              })

          for summary in summaries:
              if any(item["workers"] == summary["workers"] for item in cross_differences):
                  summary["eligible"] = False
                  summary.setdefault("eligibilityFailures", []).append("crossTierDeterministic")
          eligible = [summary for summary in summaries if summary.get("eligible")]
          winner = max(eligible, key=lambda item: (item["usefulMatchesPerHour"], -item["workers"]), default=None)
          decision = {
              "schemaVersion": "1.0.0",
              "decisionInfluence": "NONE",
              "formalSelection": False,
              "purpose": "GITHUB_RUNNER_QUICK_SCREEN",
              "measurementComplete": measurement_complete,
              "screenWinnerWorkers": winner["workers"] if winner else None,
              "crossCountMismatchCount": len(cross_differences),
              "crossCountDifferences": cross_differences,
              "crossCountIncompleteCount": len(cross_incomplete),
              "crossCountIncomplete": cross_incomplete,
              "summaries": summaries,
          }
          (root / "quick-screen-decision.json").write_text(
              json.dumps(decision, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(decision, indent=2, sort_keys=True))
          if not measurement_complete:
              raise SystemExit("Quick-screen measurement is incomplete")
          if cross_differences:
              raise SystemExit("Quick screen contains deterministic drift")
          if winner is None:
              raise SystemExit("Quick screen has no eligible tier")
          PY

      - name: Upload quick-screen decision
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strategic-ai-quick-screen-decision-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-quick/quick-screen-decision.json
          if-no-files-found: error
          retention-days: 1
