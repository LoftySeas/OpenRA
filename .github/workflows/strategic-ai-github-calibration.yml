name: Strategic AI GitHub Runner Eight Worker Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Ubuntu 8-worker paired eight-job diagnostic
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Clone exact calibration commit
        uses: actions/checkout@v7

      - name: Install .NET 10 and runtime packages
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libopenal1 mesa-utils time

      - name: Build the Linux worker once
        run: dotnet build -c Debug -nologo -warnaserror -p:TargetPlatform=linux-x64

      - name: Prepare verified RA content
        run: |
          mkdir -p "$RUNNER_TEMP/strategic-ai-content"
          python3 tools/prepare_ra_content.py --support-dir "$RUNNER_TEMP/strategic-ai-content"

      - name: Materialize the frozen paired eight-job calibration
        run: |
          python3 tools/prepare_m3_experiment.py \
            --plan docs/ai/examples/m3-experiment-plan.json \
            --phase training \
            --output-dir "$RUNNER_TEMP/m3-calibration-registration"
          python3 tools/prepare_github_runner_calibration.py \
            --source-manifest "$RUNNER_TEMP/m3-calibration-registration/experiment-manifest.json" \
            --output-manifest "$RUNNER_TEMP/m3-calibration-registration/github-calibration-manifest.json"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "m3-calibration-registration"
          source_path = root / "github-calibration-manifest.json"
          output_path = root / "github-paired-calibration-manifest.json"
          cells = (
              "tr-ore-lord-normal-s01-c20",
              "tr-ore-lord-rush-s07-c30",
              "tr-behind-the-veil-normal-s03-c40",
              "tr-siberian-pass-normal-s05-c60",
          )
          wanted = tuple(f"{cell}-r{repeat}" for cell in cells for repeat in range(2))
          source = json.loads(source_path.read_text(encoding="utf-8"))
          by_id = {match["id"]: match for match in source["matches"]}
          missing = [job_id for job_id in wanted if job_id not in by_id]
          if missing:
              raise SystemExit(f"Screening manifest lacks jobs: {missing!r}")
          value = dict(source)
          value["matches"] = [by_id[job_id] for job_id in wanted]
          output_path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          registration = {
              "schemaVersion": "1.0.0",
              "decisionInfluence": "NONE",
              "purpose": "GITHUB_RUNNER_EIGHT_WORKER_DIAGNOSTIC",
              "sourceManifestSha256": hashlib.sha256(source_path.read_bytes()).hexdigest(),
              "calibrationManifestSha256": hashlib.sha256(output_path.read_bytes()).hexdigest(),
              "jobCount": len(wanted),
              "jobIds": list(wanted),
          }
          (root / "github-paired-calibration-registration.json").write_text(
              json.dumps(registration, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Capture runner identity
        run: |
          mkdir -p "$RUNNER_TEMP/m3-calibration"
          python3 - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          keys = (
              "GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA",
              "RUNNER_NAME", "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion",
          )
          value = {key: os.environ.get(key) for key in keys}
          value["platform"] = platform.platform()
          value["processor"] = platform.processor()
          path = Path(os.environ["RUNNER_TEMP"]) / "m3-calibration" / "runner-metadata.json"
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          uname -a > "$RUNNER_TEMP/m3-calibration/uname.txt"
          lscpu > "$RUNNER_TEMP/m3-calibration/lscpu.txt"
          free -b > "$RUNNER_TEMP/m3-calibration/memory-before.txt"
          df -B1 "$RUNNER_TEMP" > "$RUNNER_TEMP/m3-calibration/disk-before.txt"
          xvfb-run -a -s "-screen 0 1024x768x24" glxinfo -B > "$RUNNER_TEMP/m3-calibration/glxinfo.txt"

      - name: Run one eight-worker wave
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/m3-calibration"
          samples="$root/resource-samples.csv"
          echo 'unix_ms,mem_available_bytes,load_1m,openra_processes,openra_rss_kib,disk_available_bytes' > "$samples"

          set +e
          /usr/bin/time -v -o "$root/eight-worker-time.txt" \
            xvfb-run -a -s "-screen 0 1024x768x24" \
              python3 tools/strategic_ai_runner.py run \
                --manifest "$RUNNER_TEMP/m3-calibration-registration/github-paired-calibration-manifest.json" \
                --output-root "$root/workers-8" \
                --content-dir "$RUNNER_TEMP/strategic-ai-content/Content" \
                --engine-dir "$GITHUB_WORKSPACE" \
                --max-workers 8 \
                --skip-build &
          calibration_pid=$!

          while kill -0 "$calibration_pid" 2>/dev/null; do
            unix_ms=$(date +%s%3N)
            mem_kib=$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)
            load_1m=$(awk '{ print $1 }' /proc/loadavg)
            read -r process_count rss_kib < <(
              ps -eo rss=,args= | awk '/\/bin\/OpenRA( |$)/ { count += 1; rss += $1 } END { print count + 0, rss + 0 }'
            )
            disk_bytes=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
            echo "$unix_ms,$((mem_kib * 1024)),$load_1m,$process_count,$rss_kib,$disk_bytes" >> "$samples"
            sleep 1
          done
          wait "$calibration_pid"
          controller_exit=$?
          set -e
          echo "$controller_exit" > "$root/controller-exit-code.txt"

          test -f "$root/workers-8/experiment-result.json"

      - name: Validate measurement completeness
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "m3-calibration" / "workers-8"
          result = json.loads((root / "experiment-result.json").read_text(encoding="utf-8"))
          jobs = result.get("jobs") or {}
          valid = [job for job in jobs.values() if job.get("status") == "VALID"]
          repeat = result.get("repeatEquivalence") or {}
          parity = result.get("parity") or {}
          summary = {
              "status": result.get("status"),
              "jobCount": len(jobs),
              "validCount": len(valid),
              "wallClockElapsedSeconds": result.get("wallClockElapsedSeconds"),
              "usefulMatchesPerHour": (
                  len(valid) * 3600 / result["wallClockElapsedSeconds"]
                  if result.get("wallClockElapsedSeconds") else 0
              ),
              "repeatMismatchCount": repeat.get("mismatchCount"),
              "parityMismatchCount": parity.get("mismatchCount"),
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          if len(jobs) != 8:
              raise SystemExit("The diagnostic does not contain all eight paired jobs")
          if len(valid) != 8 or repeat.get("mismatchCount") != 0 or parity.get("mismatchCount") != 0:
              raise SystemExit("The eight-worker diagnostic contains invalid or mismatched jobs")
          PY

      - name: Stage non-proprietary calibration evidence
        if: always()
        run: |
          stage="$RUNNER_TEMP/strategic-ai-calibration-evidence"
          mkdir -p "$stage"
          tar \
            --exclude='*/Content' \
            --exclude='*/Content/*' \
            --exclude='ra-quickinstall.zip' \
            -czf "$stage/github-runner-calibration.tar.gz" \
            -C "$RUNNER_TEMP" \
            m3-calibration \
            m3-calibration-registration

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strategic-ai-github-runner-eight-worker-diagnostic-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strategic-ai-calibration-evidence/github-runner-calibration.tar.gz
          if-no-files-found: error
          retention-days: 1
